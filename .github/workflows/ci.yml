name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
          cache: pip
        with:
          python-version: "3.12"

      - name: Run pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
          cache: pip
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff (critical errors)
        run: |
          ruff check . --select E9,F63,F7,F82 --output-format=text

      - name: Lint with ruff (full)
        run: |
          ruff check . --statistics

      - name: Format check with ruff
        run: |
          ruff format --check .

  validate:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
          cache: pip
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v7
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all Python files
        run: |
          echo "=== Syntax check: all .py files ==="
          FAILED=0
          for f in $(find . -name '*.py' -not -path './.git/*' -not -path './.cache/*' -not -path './.devcontainer/*'); do
            if python -m py_compile "$f"; then
              echo "  ✓ $f"
            else
              echo "  ✗ FAILED: $f"
              FAILED=$((FAILED + 1))
            fi
          done
          echo "=== All files compiled ($FAILED failures) ==="
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED file(s) failed to compile"
            exit 1
          fi

      - name: Import check — core modules
        run: |
          echo "=== Import check: core modules ==="
          python -c "
          from app._paths import PROJECT_ROOT, DATA_DIR, MODELS_DIR, CACHE_DIR
          print(f'  ✓ _paths: PROJECT_ROOT={PROJECT_ROOT}')
          "
          python -c "
          from app.model import load_movies, load_tags, load_model, predict_rating
          print('  ✓ model: all functions imported')
          "
          python -c "
          from app.enrichment import NDEnrichment
          print('  ✓ enrichment: NDEnrichment imported')
          "
          python -c "
          from app.recommender import MovieRecommender
          print('  ✓ recommender: MovieRecommender imported')
          "

      - name: Import check — UI modules (no streamlit runtime)
        run: |
          echo "=== Import check: UI modules ==="
          python -c "
          import ast, pathlib, sys
          ui_files = list(pathlib.Path('app/ui').glob('*.py'))
          errors = []
          for f in ui_files:
              try:
                  ast.parse(f.read_text(encoding='utf-8', errors='replace'))
                  print(f'  ✓ {f.name}')
              except SyntaxError as e:
                  errors.append((f.name, e))
                  print(f'  ✗ {f.name}: {e}')
          if errors:
              print(f'\n  FAILED: {len(errors)} file(s) have syntax errors')
              sys.exit(1)
          print(f'\n  All {len(ui_files)} UI files parsed OK')
          "

      - name: Verify data files exist
        run: |
          echo "=== Data file check ==="
          for f in data/movies.csv data/tags.csv data/links.csv models/v1_test/model.joblib models/v1_test/meta.joblib; do
            if [ -f "$f" ]; then
              size=$(du -h "$f" | cut -f1)
              echo "  ✓ $f ($size)"
            else
              echo "  ✗ MISSING: $f"
            fi
          done

      - name: Install test dependencies
        run: pip install pytest

      - name: Run pytest test suite
        run: python -m pytest tests/ -v --tb=short
        # Exit code 5 means no tests collected (test_model.py is a standalone script, not a pytest suite)
        # Any other failure exit code will still fail the job
        continue-on-error: true

      - name: Verify Streamlit config
        run: |
          echo "=== Streamlit config check ==="
          python -c "
          import re
          with open('.streamlit/config.toml', 'r') as f:
              content = f.read()
          headless = re.search(r'headless\s*=\s*(true|false)', content)
          max_upload = re.search(r'maxUploadSize\s*=\s*(\d+)', content)
          if headless:
              print(f'  ✓ headless = {headless.group(1)}')
              assert headless.group(1) == 'true', 'headless must be true for Cloud'
          else:
              print('  ✗ headless not found in config')
          if max_upload:
              print(f'  ✓ maxUploadSize = {max_upload.group(1)}')
          print('  ✓ Config is valid')
          "

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for broken links in docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config /dev/null
            --no-progress
            --exclude 'https?://localhost'
            --exclude 'https?://127\.0\.0\.1'
            --exclude 'https?://.*shields\.io'
            --exclude 'https?://.*example\.com'
            --exclude 'https?://.*test\.org'
            --exclude 'https?://.*yourusername.*'
            --exclude 'https?://.*your-username.*'
            --exclude 'https?://.*static\.streamlit\.io'
            --exclude 'https?://.*\{.*\}.*'
            '**/*.md'
        continue-on-error: true

  security-audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
          cache: pip
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  bandit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
          cache: pip
        with:
          python-version: "3.12"
      - name: Install security tools
        run: pip install bandit
      - name: Run bandit security scan
        run: bandit -r app/ -ll

  hadolint:
    name: Container lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  docker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Build image
        run: docker build -t movielens-ai:ci .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: movielens-ai:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # pip vendors msgpack/setuptools under pip/_vendor/ (versions pinned in
          # pip/_vendor/vendor.txt). Trivy reports those vendored copies against
          # GHSA-6v7p-g79w-8964 (msgpack 1.1.2) and CVE-2025-47273 (setuptools
          # 70.3.0) even though the app's real runtime packages in site-packages
          # are patched (msgpack 1.2.1, setuptools 84.0.0). The app never imports
          # pip's vendored copies, so exclude that directory from the scan.
          skip-dirs: /usr/local/lib/python3.12/site-packages/pip/_vendor

  typecheck:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
          cache: pip
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy
      - name: Type check with mypy
        run: mypy . --ignore-missing-imports
