name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          cache: pip
          python-version: "3.12"

      - name: Run pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          cache: pip
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.4

      - name: Lint with ruff (critical errors)
        run: |
          ruff check . --select E9,F63,F7,F82 --output-format=concise

      - name: Lint with ruff (full)
        run: |
          ruff check . --statistics

      - name: Format check with ruff
        run: |
          ruff format --check .

  validate:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          cache: pip
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all Python files
        run: |
          echo "=== Syntax check: all .py files ==="
          FAILED=0
          while IFS= read -r -d '' f; do
            if python -m py_compile "$f"; then
              echo "  ✓ $f"
            else
              echo "  ✗ FAILED: $f"
              FAILED=$((FAILED + 1))
            fi
          done < <(find . -name '*.py' -not -path './.git/*' -not -path './.cache/*' -not -path './.devcontainer/*' -print0)
          echo "=== All files compiled ($FAILED failures) ==="
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED file(s) failed to compile"
            exit 1
          fi

      - name: Import check — core modules
        run: |
          echo "=== Import check: core modules ==="
          python -c "
          from app._paths import PROJECT_ROOT, DATA_DIR, MODELS_DIR, CACHE_DIR
          print(f'  ✓ _paths: PROJECT_ROOT={PROJECT_ROOT}')
          "
          python -c "
          from app.model import load_movies, load_tags, load_model, predict_rating
          print('  ✓ model: all functions imported')
          "
          python -c "
          from app.enrichment import NDEnrichment
          print('  ✓ enrichment: NDEnrichment imported')
          "
          python -c "
          from app.recommender import MovieRecommender
          print('  ✓ recommender: MovieRecommender imported')
          "

      - name: Import check — UI modules (no streamlit runtime)
        run: |
          echo "=== Import check: UI modules ==="
          python -c "
          import ast, pathlib, sys
          ui_files = list(pathlib.Path('app/ui').glob('*.py'))
          errors = []
          for f in ui_files:
              try:
                  ast.parse(f.read_text(encoding='utf-8', errors='replace'))
                  print(f'  ✓ {f.name}')
              except SyntaxError as e:
                  errors.append((f.name, e))
                  print(f'  ✗ {f.name}: {e}')
          if errors:
              print(f'\n  FAILED: {len(errors)} file(s) have syntax errors')
              sys.exit(1)
          print(f'\n  All {len(ui_files)} UI files parsed OK')
          "

      - name: Verify data files exist
        run: |
          echo "=== Data file check ==="
          for f in data/movies.csv data/tags.csv data/links.csv models/v1_test/model.joblib models/v1_test/meta.joblib; do
            if [ -f "$f" ]; then
              size=$(du -h "$f" | cut -f1)
              echo "  ✓ $f ($size)"
            else
              echo "  ✗ MISSING: $f"
            fi
          done

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run pytest test suite
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=55
        # Fail the job on any test failure. Slow/integration tests are deselected
        # by the repo's `-m 'not slow'` addopts in pyproject.toml.

      - name: Verify Streamlit config
        run: |
          echo "=== Streamlit config check ==="
          python -c "
          import re
          with open('.streamlit/config.toml', 'r') as f:
              content = f.read()
          headless = re.search(r'headless\s*=\s*(true|false)', content)
          max_upload = re.search(r'maxUploadSize\s*=\s*(\d+)', content)
          if headless:
              print(f'  ✓ headless = {headless.group(1)}')
              assert headless.group(1) == 'true', 'headless must be true for Cloud'
          else:
              print('  ✗ headless not found in config')
          if max_upload:
              print(f'  ✓ maxUploadSize = {max_upload.group(1)}')
          print('  ✓ Config is valid')
          "

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for broken links in docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --config /dev/null
            --no-progress
            --exclude 'https?://localhost'
            --exclude 'https?://127\.0\.0\.1'
            --exclude 'https?://.*shields\.io'
            --exclude 'https?://.*example\.com'
            --exclude 'https?://.*test\.org'
            --exclude 'https?://.*yourusername.*'
            --exclude 'https?://.*your-username.*'
            --exclude 'https?://.*static\.streamlit\.io'
            --exclude 'https?://.*\{.*\}.*'
            '**/*.md'
        continue-on-error: true

  security-audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          cache: pip
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  bandit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          cache: pip
          python-version: "3.12"
      - name: Install security tools
        run: pip install bandit==1.9.4
      - name: Run bandit security scan
        run: bandit -r app/ -ll

  hadolint:
    name: Container lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          ignore: DL3066

  docker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Build image
        run: docker build -t movielens-ai:ci .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: movielens-ai:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # pip vendors msgpack/setuptools under pip/_vendor/ (versions pinned in
          # pip/_vendor/vendor.txt). Trivy reports those vendored copies against
          # GHSA-6v7p-g79w-8964 (msgpack 1.1.2) and CVE-2025-47273 (setuptools
          # 70.3.0) even though the app's real runtime packages in site-packages
          # are patched (msgpack 1.2.1, setuptools 84.0.0). The app never imports
          # pip's vendored copies, so exclude that directory from the scan.
          skip-dirs: /usr/local/lib/python3.12/site-packages/pip/_vendor

  typecheck:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          cache: pip
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy==1.15.0
      - name: Type check with mypy
        run: mypy . --ignore-missing-imports

  docker-cache:
    name: Docker image build + layer cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image (cached)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: movielens-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dive:
    name: Docker image size audit (dive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: dive-audit:latest
          cache-from: type=gha
      - name: Install dive
        run: |
          wget -q https://github.com/wagoodman/dive/releases/download/v0.12.0/dive_0.12.0_linux_amd64.deb
          sudo dpkg -i dive_0.12.0_linux_amd64.deb
      - name: Run dive (efficiency check)
        run: |
          CI=true dive dive-audit:latest
