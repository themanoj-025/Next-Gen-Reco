# ═══════════════════════════════════════════════════════════════════════
# Next-Gen-Reco — Production override
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Hardening: restart always, explicit resource limits, no dev mounts.
# ═══════════════════════════════════════════════════════════════════════

services:
  app:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
